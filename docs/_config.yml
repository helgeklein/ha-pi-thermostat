# Jekyll configuration for HA PI Thermostat & CCA Control
title: PI Thermostat & CCA Control for Home Assistant
description: >-
  A Home Assistant custom integration that combines a PI (proportional-integral) controller with CCA (concrete core activation) control.
url: "https://ha-pi-thermostat-cca-control.helgeklein.com"

# Logo configuration
logo: "/assets/img/logo.svg"

# Favicon configuration
favicon: "/assets/img/icon.svg"

# Theme
remote_theme: just-the-docs/just-the-docs

# Navigation settings - force nav_order to be respected
nav_sort: case_insensitive

# Search functionality
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Auxiliary links in header
aux_links:
  "GitHub Repository":
    - "https://github.com/helgeklein/ha-pi-thermostat-cca-control"
# Open aux links in a new tab.
aux_links_new_tab: true

# Color scheme - custom helgeklein.com inspired theme
color_scheme: helgeklein

# Just the Docs theme settings
code_copy: true

# Heading anchor links
heading_anchors: true

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Collections
collections:
  docs:
    output: true
    permalink: /:collection/:name/

# GitHub repository info
github:
  repository_url: https://github.com/helgeklein/ha-pi-thermostat-cca-control
  repository_name: ha-pi-thermostat-cca-control
  owner_name: helgeklein

# Social
author: helgeklein
social:
  github: helgeklein

# Build settings
exclude:
  - .gitignore
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
